name: ci
on: [manual]
# Stages run in file order: build, test, integration, package, staging, release.
steps:
  fmt: { stage: build, run: "gofmt -l . > unformatted.txt && test ! -s unformatted.txt", needs: [] }
  vet: { stage: build, run: "go vet ./...", needs: [] }
  compile: { stage: build, run: "go build -o bin/svc-orders-go .", artifacts: [bin/svc-orders-go], needs: [] }
  # Two rounds of the unit tests catch order-dependent flakes.
  unit: { stage: test, run: "go test -v -count=1 -shuffle=on ./...", matrix: { round: [1, 2] }, needs: [] }
  # Each shard runs the handler tests with the race detector.
  handlers: { stage: test, run: "go test -v -count=1 -race ./...", shard: 3, needs: [] }
  # Deliberate failure: the one seeded step that fails, until PATCH /orders/{id} exists (README, Open gaps).
  integration: { stage: integration, run: "go test -v -count=1 -tags integration -run Integration ./...", needs: [] }
  checksum: { stage: package, run: "go build -o bin/svc-orders-go . && sha256sum bin/svc-orders-go", needs: [] }
  smoke: { stage: staging, run: "go build -o bin/svc-orders-go . && (PORT=18080 ./bin/svc-orders-go & sleep 2; curl -fsS localhost:18080/healthz; s=$?; kill $!; exit $s)", needs: [] }
  verify-mod: { stage: staging, run: "go mod verify", needs: [] }
  describe: { stage: release, run: "git describe --tags --always", needs: [] }
  notes: { stage: release, run: "git log --oneline -10", needs: [] }
