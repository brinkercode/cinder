name: outside-prs
# Closes pull requests from people without write access, with a pointer to CONTRIBUTING.md.
# pull_request_target runs in this repository's context; it never checks out or runs the pull request's code.
on:
  pull_request_target:
    types: [opened, reopened]
permissions:
  pull-requests: write
jobs:
  close:
    if: ${{ !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr close "$PR" -R "$REPO" --comment "Thanks for your interest in cinder. Pull requests are only accepted from collaborators; see [CONTRIBUTING.md](https://github.com/$REPO/blob/main/CONTRIBUTING.md#outside-contributions) for how to propose a change. Security issues go through [SECURITY.md](https://github.com/$REPO/blob/main/SECURITY.md)."
