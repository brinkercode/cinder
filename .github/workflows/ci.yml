name: ci
# Every job runs on a GitHub-hosted runner. Pull requests from forks get no secrets.
on:
  pull_request:   # PRs only: main gets the same tree that passed on the PR; releases deploy from main (release.yml)
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The jobs run on ubuntu-latest and install Node, Go and staticcheck first. The two halves of make check run in parallel.
  # `ts` is the required check name: it passes only when every Worker shard and the web job did.
  worker:
    # The Worker suite (about 1,200 tests) in 3 parallel shards.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm exec -w worker -- vitest run --shard=${{ matrix.shard }}/3
  web:
    # Everything else make check-ts runs: Worker lint, web lint and tests, the git fsck test, and the PR guards.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: make check-deps
      - run: npm exec -w worker -- eslint --max-warnings 0 src test
      - run: npm run check -w web
      - run: node --test e2e/git-fsck.test.js
  ts:
    needs: [worker, web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.worker.result }}" = success ] && [ "${{ needs.web.result }}" = success ]'
  seed:
    # The seed repos' own checks (make check-seed, about 7 min) in parallel, so a broken seed repo fails CI.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: make check-seed
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: runner/go.mod
      - run: go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
      - run: make check-go
  # Builds the slim runner image when a Dockerfile changes and reports its size and cold start.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: changed
        env:
          BASE: ${{ github.base_ref }}
        run: git diff --quiet "origin/$BASE...HEAD" -- 'runner/Dockerfile*' || echo dockerfile=1 >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.dockerfile
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: runner/go.mod
      - if: steps.changed.outputs.dockerfile
        run: make check-image
      - if: steps.changed.outputs.dockerfile
        name: image size and cold start
        run: |
          img=cinder-runner-slim-test
          size=$(docker image inspect -f '{{.Size}}' $img)
          start=$(date +%s%N); docker run --rm --entrypoint true $img; ms=$(( ($(date +%s%N) - start) / 1000000 ))
          echo "$img: $((size / 1000000)) MB, cold start ${ms} ms" | tee -a "$GITHUB_STEP_SUMMARY"
  image-full:
    # Builds runner/Dockerfile.full when it changes, so a broken full image fails the PR instead of the release.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: changed
        env:
          BASE: ${{ github.base_ref }}
        run: git diff --quiet "origin/$BASE...HEAD" -- runner/Dockerfile.full || echo full=1 >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.full
        name: build the full runner image
        run: docker build -f runner/Dockerfile.full -t cinder-runner-full-test runner
