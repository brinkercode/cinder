<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-labelledby="ttl dsc">
<!--
Colours and type follow Cloudflare's public brand references (checked 2026-10-06):
  - Cloudflare Orange #F38020, Tangerine #FAAE40 and dark gray #404041: the official logo colours,
    as published in the press kit logo files (https://www.cloudflare.com/press-kit/ , Logos.zip).
  - Naming: Cloudflare trademark guidelines (https://www.cloudflare.com/trademark/); product names are plain text.
  - Type: the font stack of Cloudflare's developer docs (https://developers.cloudflare.com/):
    Inter, system-ui ... sans-serif and JetBrains Mono, ui-monospace ... monospace.
  No Cloudflare logo, cloud mark or other artwork is used.
-->
<title id="ttl">cinder secrets and model access</title><desc id="dsc">A person's provider key (My model access) and the org's deploy, signing and webhook secrets go into Secrets Store; org model keys go into AI Gateway stored keys. Cloudflare encrypts and holds every value; cinder keeps only references. A model key never enters a job: the container egress sends model calls to AI Gateway, which adds the stored key. A flow job reads its own secrets for its lease and its output is masked. Values never land in D1, logs, queue messages, job payloads or the browser.</desc>
<style>
.card{fill:#1B1B1D;stroke:#2E2E32}
.box{fill:#242427;stroke:#45454B;stroke-width:1}
.hub{fill:#242427;stroke:#F38020;stroke-width:1.5}
.edge{fill:#242427;stroke:#FAAE40;stroke-width:1.5}
.pill{fill:#3A2A12;stroke:#FAAE40;stroke-width:1}
.plan{stroke-dasharray:5 4}
.w{fill:none;stroke:#A3A3A9;stroke-width:1.4}
.as{fill:none;stroke:#A3A3A9;stroke-width:1.2;stroke-dasharray:1 4;stroke-linecap:round}
.ah{fill:#A3A3A9}
text{font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}
.t{fill:#F2F2F3;font-size:13.5px;font-weight:600}
.s{fill:#A3A3A9;font-size:12.5px}
.m{fill:#A3A3A9;font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px}
.mi{fill:#F2F2F3;font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px}
.e{fill:#A3A3A9;font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:11px;font-weight:600;letter-spacing:.08em}
.l{fill:#A3A3A9;font-size:11.5px}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<rect x="0.5" y="0.5" width="999" height="659" rx="16" class="card"/>
<rect x="40" y="40" width="300" height="78" rx="10" class="box"/>
<text x="54" y="63" class="t">You · My model access</text>
<text x="54" y="83" class="s">your own provider key</text>
<rect x="400" y="40" width="300" height="78" rx="10" class="box"/>
<text x="414" y="63" class="t">Org admins · Secrets</text>
<text x="414" y="83" class="s">org model keys</text>
<text x="414" y="100" class="s">deploy, signing, webhook secrets</text>
<rect x="40" y="180" width="300" height="86" rx="10" class="box"/>
<text x="54" y="203" class="t">Secrets Store</text>
<text x="54" y="223" class="s">keystore, webhooks: cinder-secrets</text>
<text x="54" y="240" class="s">signing key: the cinder Worker</text>
<text x="54" y="257" class="s">personal keys for AI Gateway</text>
<rect x="400" y="180" width="300" height="86" rx="10" class="box"/>
<text x="414" y="203" class="t">AI Gateway stored keys</text>
<text x="414" y="223" class="s">BYOK per provider</text>
<text x="414" y="240" class="s">logs with person metadata</text>
<rect x="760" y="180" width="210" height="86" rx="10" class="box"/>
<text x="774" y="203" class="t">Model providers</text>
<text x="774" y="223" class="s">Anthropic · OpenAI</text>
<text x="774" y="240" class="s">Google · xAI · Workers AI</text>
<path d="M 190 118 L 190 176" class="w" marker-end="url(#ar)"/>
<path d="M 550 118 L 550 176" class="w" marker-end="url(#ar)"/>
<path d="M 440 118 L 440 146 L 300 146 L 300 176" class="w" marker-end="url(#ar)"/>
<path d="M 700 223 L 756 223" class="w" marker-end="url(#ar)"/>
<rect x="40" y="350" width="300" height="86" rx="10" class="hub"/>
<text x="54" y="373" class="t">cinder Worker + D1</text>
<text x="54" y="393" class="s">references only: secret name,</text>
<text x="54" y="410" class="s">version, owner and audit trail</text>
<path d="M 110 266 L 110 350" class="as"/>
<text x="120" y="312" class="l">reference, never the value</text>
<rect x="400" y="350" width="300" height="86" rx="10" class="box"/>
<text x="414" y="373" class="t">Container egress</text>
<text x="414" y="393" class="s">models.internal → AI Gateway</text>
<text x="414" y="410" class="s">per-job host allowlist</text>
<text x="414" y="427" class="s">the job's own flow secrets</text>
<path d="M 290 266 L 290 316 L 480 316 L 480 346" class="w" marker-end="url(#ar)"/>
<text x="488" y="336" class="l">read for the lease</text>
<path d="M 620 350 L 620 270" class="w" marker-end="url(#ar)"/>
<text x="628" y="312" class="l">model calls</text>
<rect x="400" y="510" width="300" height="78" rx="10" class="box"/>
<text x="414" y="533" class="t">Ephemeral job instance</text>
<text x="414" y="553" class="s">never holds a model key</text>
<text x="414" y="570" class="s">output masked as ***</text>
<path d="M 550 510 L 550 440" class="w" marker-end="url(#ar)"/>
<text x="558" y="480" class="l">every outbound request</text>
<rect x="760" y="350" width="210" height="238" rx="10" class="edge"/>
<text x="774" y="374" class="t">Values never land in</text>
<text x="774" y="400" class="s">×  D1 rows</text>
<text x="774" y="422" class="s">×  Workers Logs · R2 logs</text>
<text x="774" y="444" class="s">×  Queue messages</text>
<text x="774" y="466" class="s">×  job payloads · git</text>
<text x="774" y="488" class="s">×  the browser</text>
<text x="774" y="520" class="l">cinder encrypts nothing</text>
<text x="774" y="537" class="l">itself; Cloudflare holds</text>
<text x="774" y="554" class="l">and encrypts every value.</text>
<rect x="24" y="612" width="26" height="16" rx="5" class="hub"/>
<text x="58" y="624.5" class="l">cinder (references)</text>
<rect x="208.36" y="612" width="26" height="16" rx="5" class="box"/>
<text x="242.36" y="624.5" class="l">live today</text>
<rect x="334.76" y="612" width="26" height="16" rx="5" class="box plan"/>
<text x="368.76" y="624.5" class="l">planned (not yet live)</text>
</svg>
