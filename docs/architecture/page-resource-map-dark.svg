<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" width="1000" height="730" role="img" aria-labelledby="ttl dsc">
<!--
Colours and type follow Cloudflare's public brand references (checked 2026-10-06):
  - Cloudflare Orange #F38020, Tangerine #FAAE40 and dark gray #404041: the official logo colours,
    as published in the press kit logo files (https://www.cloudflare.com/press-kit/ , Logos.zip).
  - Naming: Cloudflare trademark guidelines (https://www.cloudflare.com/trademark/); product names are plain text.
  - Type: the font stack of Cloudflare's developer docs (https://developers.cloudflare.com/):
    Inter, system-ui ... sans-serif and JetBrains Mono, ui-monospace ... monospace.
  No Cloudflare logo, cloud mark or other artwork is used.
-->
<title id="ttl">cinder pages and their Cloudflare resources</title><desc id="dsc">Each sidebar page and the Cloudflare resource behind it. Repo pages: Code, with Releases on its toolbar, on Artifacts and D1; Changes, which holds the repo's issues, on D1, RepoDO, ChangeDO and guard and verify jobs on the runner pool; Watchtower on D1, scan jobs, Vectorize and Clef; Insights on Analytics Engine and AI Gateway logs; repo Settings on D1 and .cinder.yml in Artifacts. Automation: Agents on Artifacts cinder-agents, D1 and AI Gateway; Marketplace on D1 and release jobs; Judges on Clef through AI Gateway and D1; Flows on runner pool jobs, Workflows and R2 logs; Environments on Workflows and the Workers API; Workers on the Containers pool and DispatchDO. Organization: Repositories on D1 and Artifacts; Wiki on an org Artifacts repo and D1; Needs you on D1 and ChangeDO; Access and people on Cloudflare Access and D1; Keystore on Secrets Store; My model access on Secrets Store and AI Gateway.</desc>
