<title id="ttl">cinder git and change lifecycle</title><desc id="dsc">A push lands in Artifacts, which emits cf.artifacts.repo.pushed and starts the cinder-pipeline Workflow; it hands the push to the cinder-events Queue, whose consumer queues guard and verify jobs on the runner pool. A change moves from leased through developing and verifying to in_queue and merged. The risk judge routes a verified change: an untrusted judge sends it to the reviewer agent, a trusted high answer to a person. RepoDO holds the symbol leases and settles a collision by stacking or a seam; ChangeDO holds the change and its merge queue entry. Clef judges on Workers AI answer at each step and are scored against outcomes. At merge the Worker signs the merge commit with a key bound from Secrets Store, and a history job writes the change's record.</desc>
