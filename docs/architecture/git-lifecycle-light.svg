<text x="510.0" y="83.0" class="mi" text-anchor="middle">cf.artifacts.repo.pushed</text>
<path d="M 610 79 L 636 79" class="w" marker-end="url(#ar)"/>
<rect x="640" y="40" width="150" height="78" rx="10" class="box"/>
<text x="654" y="63" class="t">Workflow</text>
<text x="654" y="83" class="m">cinder-pipeline</text>
<path d="M 790 79 L 816 79" class="w" marker-end="url(#ar)"/>
<rect x="820" y="40" width="160" height="78" rx="10" class="box"/>
<text x="834" y="63" class="t">Queue</text>
<text x="834" y="83" class="m">cinder-events</text>
<text x="834" y="100" class="s">→ guard + verify</text>
<text x="416" y="114" class="l">event trigger, namespace-wide</text>
