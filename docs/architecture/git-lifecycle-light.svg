<text x="600" y="154" class="l">guard + verify results</text>
<text x="140" y="258" class="l">also: needs_fix · conflict → resolving · waiting (stacked)</text>
<text x="140" y="276" class="l">risk route: untrusted → reviewer agent · high → a person</text>
<rect x="40" y="310" width="280" height="96" rx="10" class="box"/>
<text x="54" y="333" class="t">RepoDO · per repo</text>
<text x="54" y="353" class="s">symbol leases while developing</text>
<text x="54" y="370" class="s">collision → stack or seam</text>
<text x="54" y="387" class="s">per-target merge queues</text>
<rect x="360" y="310" width="280" height="96" rx="10" class="box"/>
<text x="374" y="333" class="t">ChangeDO · per change</text>
<text x="374" y="353" class="s">state, events, acceptance</text>
<text x="374" y="370" class="s">its merge queue entry</text>
<text x="374" y="387" class="s">stacked: merges after its base</text>
<rect x="680" y="310" width="280" height="96" rx="10" class="box"/>
<text x="694" y="333" class="t">Clef judges · Workers AI</text>
<text x="694" y="353" class="s">lease · collision · seam · split</text>
<text x="694" y="370" class="s">guard · risk · flake</text>
<text x="694" y="387" class="s">scored against outcomes</text>
<path d="M 120 236 L 120 310" class="as"/>
<path d="M 620 236 L 620 310" class="as"/>
<path d="M 820 236 L 820 310" class="as"/>
<text x="40" y="474" class="e">MERGE</text>
<rect x="40" y="490" width="220" height="86" rx="10" class="box"/>
<text x="54" y="513" class="t">Secrets Store</text>
<text x="54" y="533" class="s">merge-signing key</text>
<text x="54" y="550" class="s">bound to the Worker only</text>
