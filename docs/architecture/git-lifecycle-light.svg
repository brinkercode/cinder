<text x="314" y="533" class="s">signs the merge commit</text>
<text x="314" y="550" class="s">runners never see the key</text>
<path d="M 660 236 L 660 450 L 420 450 L 420 486" class="w" marker-end="url(#ar)"/>
<path d="M 540 533 L 576 533" class="w" marker-end="url(#ar)"/>
<rect x="580" y="490" width="160" height="86" rx="10" class="box"/>
<text x="594" y="513" class="t">target branch</text>
<text x="594" y="533" class="s">signed merge commit</text>
<text x="594" y="550" class="s">in Artifacts</text>
<path d="M 740 533 L 776 533" class="w" marker-end="url(#ar)"/>
<rect x="780" y="490" width="180" height="86" rx="10" class="box"/>
<text x="794" y="513" class="t">History job</text>
<text x="794" y="533" class="s">trailers on the merge</text>
<text x="794" y="550" class="s">refs/cinder/changes</text>
