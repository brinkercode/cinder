.card{fill:#F7F7F8;stroke:#E4E4E7}
.box{fill:#FFFFFF;stroke:#CFCFD4;stroke-width:1}
.hub{fill:#FFFFFF;stroke:#F38020;stroke-width:1.5}
.edge{fill:#FFFFFF;stroke:#FAAE40;stroke-width:1.5}
.pill{fill:#FEF3E2;stroke:#FAAE40;stroke-width:1}
.plan{stroke-dasharray:5 4}
.w{fill:none;stroke:#66666B;stroke-width:1.4}
.as{fill:none;stroke:#66666B;stroke-width:1.2;stroke-dasharray:1 4;stroke-linecap:round}
.ah{fill:#66666B}
text{font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}
.t{fill:#404041;font-size:13.5px;font-weight:600}
.s{fill:#66666B;font-size:12.5px}
.m{fill:#66666B;font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px}
.mi{fill:#404041;font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px}
.e{fill:#66666B;font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:11px;font-weight:600;letter-spacing:.08em}
.l{fill:#66666B;font-size:11.5px}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
