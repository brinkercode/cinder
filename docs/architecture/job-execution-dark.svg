<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-labelledby="ttl dsc">
<!--
Colours and type follow Cloudflare's public brand references (checked 2026-10-06):
  - Cloudflare Orange #F38020, Tangerine #FAAE40 and dark gray #404041: the official logo colours,
    as published in the press kit logo files (https://www.cloudflare.com/press-kit/ , Logos.zip).
  - Naming: Cloudflare trademark guidelines (https://www.cloudflare.com/trademark/); product names are plain text.
  - Type: the font stack of Cloudflare's developer docs (https://developers.cloudflare.com/):
    Inter, system-ui ... sans-serif and JetBrains Mono, ui-monospace ... monospace.
  No Cloudflare logo, cloud mark or other artwork is used.
-->
<title id="ttl">cinder job execution</title><desc id="dsc">A change, push or Flow run queues a job row in D1. The Worker starts a container in the autoscaled Containers pool for each queued job, up to the pool's max; DispatchDO serialises claims, gate jobs first. One job per instance, scaling to zero with an optional warm buffer. Every outbound request passes the Worker's container egress: a per-job allowlist, web pages as Markdown, and model calls to AI Gateway, which adds the stored key. Flow secrets are read from Secrets Store for the job's lease and masked. Results return as git commits to Artifacts and masked logs to R2. Cloudflare targets deploy through Workflows; other clouds deploy from the instance.</desc>
