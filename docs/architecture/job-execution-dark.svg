<text x="332" y="151" class="t">instance</text>
<text x="332" y="171" class="s">job A · running</text>
<rect x="482" y="128" width="150" height="70" rx="10" class="box"/>
<text x="496" y="151" class="t">instance</text>
<text x="496" y="171" class="s">job B · running</text>
<rect x="318" y="212" width="150" height="70" rx="10" class="box"/>
