.card{fill:#1B1B1D;stroke:#2E2E32}
.box{fill:#242427;stroke:#45454B;stroke-width:1}
.hub{fill:#242427;stroke:#F38020;stroke-width:1.5}
.edge{fill:#242427;stroke:#FAAE40;stroke-width:1.5}
.pill{fill:#3A2A12;stroke:#FAAE40;stroke-width:1}
.plan{stroke-dasharray:5 4}
.w{fill:none;stroke:#A3A3A9;stroke-width:1.4}
.as{fill:none;stroke:#A3A3A9;stroke-width:1.2;stroke-dasharray:1 4;stroke-linecap:round}
.ah{fill:#A3A3A9}
text{font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}
.t{fill:#F2F2F3;font-size:13.5px;font-weight:600}
.s{fill:#A3A3A9;font-size:12.5px}
.m{fill:#A3A3A9;font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px}
.mi{fill:#F2F2F3;font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px}
.e{fill:#A3A3A9;font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:11px;font-weight:600;letter-spacing:.08em}
.l{fill:#A3A3A9;font-size:11.5px}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
