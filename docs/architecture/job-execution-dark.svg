<text x="44" y="323" class="s">queued jobs → pool size</text>
<text x="44" y="340" class="s">claims serialised, leased</text>
<text x="44" y="357" class="s">lease expiry returns a job</text>
<rect x="300" y="40" width="350" height="420" rx="10" class="box"/>
<text x="316" y="66" class="t">Runner pool · Containers</text>
<text x="316" y="86" class="s">autoscaled from queue depth</text>
<text x="316" y="103" class="s">same image, runs any job kind</text>
