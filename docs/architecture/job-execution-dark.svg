<text x="724" y="360" class="s">→ Workers AI · Anthropic · OpenAI</text>
<path d="M 970 208 L 985 208 L 985 449 L 970 449" class="w" marker-end="url(#ar)"/>
<rect x="710" y="410" width="260" height="78" rx="10" class="box"/>
<text x="724" y="433" class="t">Other clouds</text>
<text x="724" y="453" class="s">AWS · Google Cloud · Azure · SSH</text>
